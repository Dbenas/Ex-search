name: deploy-api

# Builds the API image and rolls it out to Cloud Run. Authentication uses
# Workload Identity Federation: no long-lived GCP key is stored in GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/curator/api

jobs:
  deploy:
    # Skipped until the GCP project is provisioned (see infra/terraform).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" backend
          docker push "${IMAGE}:${GITHUB_SHA}"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: curator-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
