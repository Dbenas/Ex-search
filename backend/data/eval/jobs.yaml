# Test cases from the challenge brief. `expected_top` is the candidate the
# partners expect in first place; the rest of the ranking is not asserted.
- id: vaga-1-cto
  title: Tech Lead / CTO
  expected_top: cand-carolina-mendes
  description: >
    Startup B2B de rápido crescimento busca CTO com forte viés em IA e dados.
    Necessário perfil hands-on para escalar o time técnico e construir
    arquitetura escalável do zero. Ambiente dinâmico, exige alta
    adaptabilidade e inovação.

- id: vaga-2-cfo
  title: CFO - Reestruturação
  expected_top: cand-ana-silva
  description: >
    Empresa de tecnologia em fase de alto crescimento busca CFO para liderar
    próxima rodada de captação institucional e preparar a empresa para futuro
    M&A. Exige experiência prévia com startups em estágios avançados e
    relacionamento com fundos de VC.
