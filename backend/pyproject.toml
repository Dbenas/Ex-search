[project]
name = "curator"
version = "0.1.0"
description = "RAG agent for executive search: ranks C-level candidates against a job description with grounded, consultive rationale."
authors = [{ name = "Dryelson", email = "drielson95@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic[vertex]>=1.8.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "google-genai>=2.25.0",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.4.11",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
curator = "curator.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]  # Portuguese text uses typographic quotes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "fastembed.*", "chromadb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: loads the embedding model"]
